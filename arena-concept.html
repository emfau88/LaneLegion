<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b0f" />
  <title>Lane Legion: P0 Visual Target</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, 'Times New Roman', serif;
      background: #080b0f;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 12%, rgba(66, 87, 109, 0.28), transparent 42%),
        radial-gradient(circle at 12% 88%, rgba(83, 55, 24, 0.2), transparent 38%),
        #080b0f;
    }
    picture {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
    }
    img {
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 20px 55px rgba(0, 0, 0, 0.7));
    }
    .label {
      position: fixed;
      z-index: 2;
      top: 14px;
      left: 14px;
      padding: 8px 12px;
      border: 1px solid rgba(221, 178, 91, 0.58);
      border-radius: 999px;
      background: rgba(6, 9, 13, 0.84);
      color: #e6c981;
      font: 700 11px/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="label">P0 visual target · responsive</div>
  <picture>
    <source media="(max-aspect-ratio: 4 / 3)" srcset="./design/compact-arena-p0-compact.png" />
    <img src="./design/compact-arena-p0-wide.png" alt="Lane Legion Compact Arena P0 visual target" />
  </picture>
  <script>
    const forcedLayout = new URLSearchParams(window.location.search).get('layout');
    if (forcedLayout === 'wide' || forcedLayout === 'compact') {
      document.querySelector('source')?.remove();
      document.querySelector('img').src = `./design/compact-arena-p0-${forcedLayout}.png`;
      document.querySelector('.label').textContent = `P0 visual target · ${forcedLayout}`;
    }
  </script>
</body>
</html>
