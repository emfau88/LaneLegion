<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d18" />
  <title>Lane Legion: Compact Arena</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 16%, rgba(37, 56, 82, 0.62), transparent 46%),
        radial-gradient(circle at 12% 88%, rgba(81, 53, 24, 0.2), transparent 36%),
        #070a10;
      touch-action: none;
      user-select: none;
    }
    #arena-game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9)) !important;
      height: min(100vh, calc(100vw * 9 / 16)) !important;
      max-width: none !important;
      max-height: none !important;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.62);
    }
    @media (max-aspect-ratio: 4 / 3) {
      #arena-game {
        align-items: flex-start;
      }
      canvas {
        width: 100vw !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="arena-game"></div>
  <script type="module" src="/src/arena/main.ts"></script>
</body>
</html>
