<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#263c43" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lane Legion: Compact Arena</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #263c43;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at 50% 12%, rgba(194, 150, 79, 0.4), transparent 48%),
        linear-gradient(135deg, #20383f, #6a5135 54%, #253b37);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      height: 100dvh;
    }

    #arena-game {
      position: fixed;
      inset:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: min(100%, calc(100dvh * 16 / 9)) !important;
      height: min(100dvh, calc(100vw * 9 / 16)) !important;
      max-width: none !important;
      max-height: none !important;
      box-shadow: 0 22px 70px rgba(74, 96, 83, 0.28);
    }

    #rotate-device {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top, 0))
        max(24px, env(safe-area-inset-right, 0))
        max(24px, env(safe-area-inset-bottom, 0))
        max(24px, env(safe-area-inset-left, 0));
      overflow: auto;
      background:
        linear-gradient(rgba(247, 251, 239, 0.4), rgba(227, 244, 237, 0.8)),
        url('/src/assets/arena/compact-arena-floor-p4.png') center / cover;
    }

    .rotate-card {
      width: min(100%, 430px);
      padding: 26px 22px 22px;
      border: 1px solid #c58b35;
      border-radius: 14px;
      color: #203442;
      text-align: center;
      background: linear-gradient(145deg, rgba(255, 252, 240, 0.98), rgba(238, 247, 239, 0.98));
      box-shadow:
        inset 0 0 0 3px #ead2a5,
        inset 0 2px 0 rgba(255, 255, 255, 0.9),
        0 22px 70px rgba(65, 92, 77, 0.28);
    }

    .rotate-mark {
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      place-items: center;
      border: 2px solid #d69a35;
      border-radius: 50%;
      color: #b87412;
      font: 700 38px/1 Arial, sans-serif;
      box-shadow: 0 0 34px rgba(56, 169, 214, 0.2);
    }

    .rotate-eyebrow {
      margin: 0 0 6px;
      color: #657783;
      font: 700 11px/1.2 "Trebuchet MS", Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .rotate-card h1 {
      margin: 0;
      color: #a86600;
      font-size: clamp(26px, 8vw, 38px);
      text-shadow: 0 1px 0 #fff;
    }

    .rotate-card p {
      max-width: 34ch;
      margin: 12px auto 18px;
      color: #506674;
      font: 16px/1.5 "Trebuchet MS", Arial, sans-serif;
    }

    .mobile-primary {
      min-width: 48px;
      min-height: 48px;
      border: 1px solid #cc8c2a;
      border-radius: 8px;
      color: #203442;
      font: 700 15px/1 Georgia, "Times New Roman", serif;
      cursor: pointer;
      background: linear-gradient(#fff4c9, #f4cf76);
      box-shadow: inset 0 0 0 3px #f9e6b1, 0 8px 24px rgba(73, 95, 82, 0.22);
    }

    .mobile-primary {
      width: 100%;
      padding: 0 20px;
    }

    .mobile-primary:active {
      transform: translateY(1px);
    }

    .legacy-link {
      display: inline-block;
      margin-top: 16px;
      color: #277ca8;
      font: 14px/1.3 "Trebuchet MS", Arial, sans-serif;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #arena-game {
        visibility: hidden;
        pointer-events: none;
      }

      #rotate-device {
        display: grid;
      }
    }

    @media (orientation: landscape) and (max-height: 600px) and (max-width: 1200px) {
      #arena-game {
        inset: 0;
        display: flex;
      }

      canvas {
        position: static;
        width: 100vw !important;
        height: auto !important;
        min-width: 100vw !important;
        margin: 0 !important;
        transform: none;
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main id="arena-game" aria-label="Lane Legion Compact Arena game"></main>

  <section id="rotate-device" aria-labelledby="rotate-title">
    <div class="rotate-card">
      <div class="rotate-mark" aria-hidden="true">↻</div>
      <p class="rotate-eyebrow">Lane Legion · Compact Arena</p>
      <h1 id="rotate-title">Turn to battle</h1>
      <p>The arena is designed for landscape play. Start fullscreen, then tap a fighter and an empty blue tile to form your line.</p>
      <button class="mobile-primary" id="mobile-play" type="button">PLAY IN LANDSCAPE</button>
      <a class="legacy-link" href="./index.html">Play the original Lane Legion instead</a>
    </div>
  </section>

  <script>
    const enterMobilePlay = async () => {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
        }
      } catch (_) {
        // Fullscreen support differs between mobile browsers; rotation still works manually.
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (_) {
        // iOS and some embedded browsers do not expose orientation locking.
      }

      window.dispatchEvent(new Event('resize'));
    };

    document.getElementById('mobile-play').addEventListener('click', enterMobilePlay);
  </script>
  <script type="module" src="/src/arena/main.ts"></script>
</body>
</html>
